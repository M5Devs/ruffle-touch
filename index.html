<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruffle Touch Demo</title>
    <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RuffleTouch">
  <link rel="stylesheet" href="src/ruffle-touch.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0b0e;
      color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #player-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      margin: 0 auto;
      background-color: #0b0b0e;
      position: relative;
    }

    /* Launcher Card Styles */
    .launcher-card {
      background: rgba(22, 27, 34, 0.85);
      border: 2px dashed #30363d;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s ease, background-color 0.2s ease;
      z-index: 5;
    }

    .launcher-card.dragover {
      border-color: #58a6ff;
      background-color: rgba(30, 40, 55, 0.95);
      transform: scale(1.02);
    }

    .launcher-card.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      visibility: hidden;
      display: none !important;
    }

    body.game-running header {
      display: none !important;
    }

    .launcher-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: inline-block;
    }

    .launcher-card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #f0f4f8;
    }

    .launcher-card p {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-launcher {
      background-color: #238636;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-launcher:hover {
      background-color: #2ea043;
    }

    .btn-launcher:active {
      transform: scale(0.96);
    }

    .launcher-actions {
      margin-bottom: 20px;
    }

    .launcher-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #8b949e;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .launcher-divider::before,
    .launcher-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #30363d;
    }

    .launcher-divider span {
      padding: 0 12px;
    }

    .url-input-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .url-input-container {
        flex-direction: row;
      }
    }

    .url-input {
      flex: 1;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 14px;
      color: #f0f4f8;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .url-input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }

    .btn-fetch {
      background-color: #1f6beb;
      box-shadow: 0 4px 12px rgba(31, 107, 235, 0.4);
      white-space: nowrap;
      justify-content: center;
    }

    .btn-fetch:hover {
      background-color: #388bfd;
    }

    .launcher-status {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #58a6ff;
    }

    .launcher-status.error {
      color: #f85149;
    }

    .launcher-status.hidden {
      display: none !important;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(88, 166, 255, 0.3);
      border-radius: 50%;
      border-top-color: #58a6ff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- Load official Ruffle Web build via unpkg CDN -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="title">
        <span>🎮 Ruffle Touch Gamepad</span>
      </div>
    </header>

    <div id="player-container">
      <div id="launcher-card" class="launcher-card">
        <div class="launcher-icon">🎮</div>
        <h2>Flash Game Launcher</h2>
        <p>Drag and drop a Flash (.swf) game file here, or click below to select one from your device.</p>
        <div class="launcher-actions">
          <button type="button" id="btn-select-swf" class="btn-launcher">
            📁 Choose SWF File
          </button>
        </div>

        <div class="launcher-divider">
          <span>OR</span>
        </div>

        <div class="url-input-container">
          <input type="url" id="swf-url-input" class="url-input" placeholder="Enter webpage or direct .swf URL..." autocomplete="off" spellcheck="false">
          <button type="button" id="btn-fetch-swf" class="btn-launcher btn-fetch">
            🌐 Fetch & Play
          </button>
        </div>

        <div id="launcher-status" class="launcher-status hidden">
          <div class="spinner"></div>
          <span id="status-text">Loading...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Hidden File Input for Game Loading -->
  <input type="file" id="global-swf-input" accept=".swf" style="display: none;">

  <!-- Load RuffleTouch script -->
  <script src="src/ruffle-touch.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let rufflePlayerInstance = null;

      const playerContainer = document.getElementById('player-container');
      const launcherCard = document.getElementById('launcher-card');
      const globalFileInput = document.getElementById('global-swf-input');
      const btnSelectSwf = document.getElementById('btn-select-swf');
      const swfUrlInput = document.getElementById('swf-url-input');
      const btnFetchSwf = document.getElementById('btn-fetch-swf');
      const launcherStatus = document.getElementById('launcher-status');
      const statusText = document.getElementById('status-text');

      // Register Service Worker for Offline PWA Support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            console.log('[App] ServiceWorker registered with scope:', registration.scope);
          }).catch((error) => {
            console.error('[App] ServiceWorker registration failed:', error);
          });
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('[App] Service worker controller changed. App ready for offline play.');
        });
      }

      // Instantiate RuffleTouch controller overlay attached to #app container (hidden by default)
      const ruffleTouch = new RuffleTouch({
        container: document.getElementById('app'),
        visible: false,
        onFileSelect: (file) => {
          loadSwfFile(file);
        }
      });

      function triggerFilePicker() {
        globalFileInput.click();
      }

      function showStatus(msg, isError = false) {
        if (!launcherStatus) return;
        launcherStatus.classList.remove('hidden', 'error');
        if (isError) launcherStatus.classList.add('error');
        if (statusText) statusText.textContent = msg;
      }

      function hideStatus() {
        if (launcherStatus) launcherStatus.classList.add('hidden');
      }

      btnSelectSwf.addEventListener('click', triggerFilePicker);

      globalFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          loadSwfFile(file);
          globalFileInput.value = '';
        }
      });

      // Handle URL Fetch & Play
      async function handleUrlFetch() {
        const url = swfUrlInput ? swfUrlInput.value.trim() : '';
        if (!url) {
          showStatus('Please enter a webpage or .swf URL.', true);
          return;
        }

        btnFetchSwf.disabled = true;
        showStatus('Extracting SWF...', false);

        try {
          const result = await RuffleTouch.fetchAndExtractSwf(url, (msg, isErr) => {
            showStatus(msg, isErr);
          });

          loadSwfBuffer(result.data, result.filename);
        } catch (err) {
          showStatus(err.message || 'Failed to extract SWF file.', true);
          ruffleTouch.showToast('❌ ' + (err.message || 'Failed to extract SWF file.'));
        } finally {
          btnFetchSwf.disabled = false;
        }
      }

      if (btnFetchSwf) {
        btnFetchSwf.addEventListener('click', handleUrlFetch);
      }

      if (swfUrlInput) {
        swfUrlInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleUrlFetch();
          }
        });
      }

      // Drag and drop support on launcher card & container
      ['dragenter', 'dragover'].forEach(eventName => {
        playerContainer.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          launcherCard.classList.add('dragover');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        playerContainer.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          launcherCard.classList.remove('dragover');
        }, false);
      });

      playerContainer.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          loadSwfFile(files[0]);
        }
      });

      function startPlayerWithBuffer(arrayBuffer, filename = 'game.swf') {
        document.body.classList.add('game-running');

        // Obtain Ruffle player instance using Ruffle API window.RufflePlayer
        const ruffle = window.RufflePlayer ? window.RufflePlayer.newest() : null;
        if (!ruffle) {
          alert('Ruffle failed to initialize from CDN.');
          return;
        }

        // Clean up previous instance if exists
        if (rufflePlayerInstance && rufflePlayerInstance.parentNode) {
          rufflePlayerInstance.parentNode.removeChild(rufflePlayerInstance);
        }

        // Store binary data in ruffleTouch for archival download
        ruffleTouch.setLoadedSwf(arrayBuffer, filename);

        // Hide launcher card with smooth fade
        launcherCard.classList.add('hidden');

        // Create player element using Ruffle JavaScript API
        rufflePlayerInstance = ruffle.createPlayer();
        playerContainer.appendChild(rufflePlayerInstance);

        // Connect touch gamepad to the player element
        ruffleTouch.setPlayer(rufflePlayerInstance);
        ruffleTouch.setTarget(rufflePlayerInstance);
        ruffleTouch.show();

        // Load SWF data into player
        rufflePlayerInstance.load({
          data: arrayBuffer,
          allowScriptAccess: true
        });
      }

      function loadSwfBuffer(arrayBuffer, filename = 'game.swf') {
        startPlayerWithBuffer(arrayBuffer, filename);
      }

      function loadSwfFile(file) {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          startPlayerWithBuffer(event.target.result, file.name);
        };
        reader.readAsArrayBuffer(file);
      }
    });
  </script>
</body>
</html>
